name: Build FinaSU (merged)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'device codename'
        required: true
        default: 'star'
      enable_susfs:
        description: '1=SUSFS on, 0=off'
        required: true
        default: '1'
      enable_preinit:
        description: '1=preinit on (risk), 0=off (safe)'
        required: true
        default: '0'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup FinaSU
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf KernelSU
          git submodule deinit -f KernelSU 2>/dev/null || true
          rm -rf .git/modules/KernelSU 2>/dev/null || true
          git clone --depth 50 https://github.com/LyraVoid/FinaSU.git /tmp/FinaSU
          cd /tmp/FinaSU && git log -1 --format='%H %s'
          cd "$GITHUB_WORKSPACE"
          bash /tmp/FinaSU/kernel/setup.sh --dir /tmp/FinaSU
          ls -l drivers/kernelsu | head -2

      - name: Apply 5.4 patches
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          H="https://raw.githubusercontent.com/ce11kjw/kbuild-helper/main"
          echo "=== fetch scripts ==="
          for f in ksu54-merge-p1.sh ksu54-merge-p2.sh ksu54-merge-p3.sh \
                   patch_selinux54.py patch_sepolicy54.py patch_kbuild54.py \
                   patch_hide54.py patch_dup54.py inject_all.py \
                   fix_all_v12.py fix_v15.py enable_hide54.py; do
            curl -sL -o "/tmp/$f" "$H/$f"
            printf "  %-26s %s\n" "$f" "$(stat -c%s /tmp/$f)"
          done

          echo ""
          echo "=== P1 ==="
          bash /tmp/ksu54-merge-p1.sh "$GITHUB_WORKSPACE"

          echo ""
          echo "=== global compat injection ==="
          python3 /tmp/inject_all.py "$GITHUB_WORKSPACE"

          echo ""
          echo "=== P2 ==="
          bash /tmp/ksu54-merge-p2.sh "$GITHUB_WORKSPACE"

          echo ""
          echo "=== SELinux policy (v3) + selinux_hide port ==="
          python3 /tmp/patch_selinux54.py "$GITHUB_WORKSPACE"
          python3 /tmp/patch_hide54.py "$GITHUB_WORKSPACE"
          python3 /tmp/patch_dup54.py "$GITHUB_WORKSPACE"
          python3 /tmp/patch_sepolicy54.py "$GITHUB_WORKSPACE"

          echo ""
          echo "=== 审查修正（7 个缺陷）==="
          python3 /tmp/fix_all_v12.py "$GITHUB_WORKSPACE"
          python3 /tmp/fix_v15.py "$GITHUB_WORKSPACE"

          echo ""
          echo "=== 真正启用 selinux_hide（反转 SUSFS 短路 + 5.4 原生后端）==="
          python3 /tmp/enable_hide54.py "$GITHUB_WORKSPACE"

          echo ""
          echo "=== P3 ==="
          if [ "${{ github.event.inputs.enable_preinit }}" = "1" ]; then
            KSU54_ENABLE_PREINIT=1 bash /tmp/ksu54-merge-p3.sh "$GITHUB_WORKSPACE"
          else
            bash /tmp/ksu54-merge-p3.sh "$GITHUB_WORKSPACE"
          fi

      - name: Verify patch state
        run: |
          S=drivers/kernelsu
          echo "--- key checks ---"
          printf "  %-26s " "selinux_hide ported"; grep -q 'KSU54_HAVE_POLICY_VIEW' $S/feature/selinux_hide.c && echo YES || echo NO
          printf "  %-26s " "sidtab dup"; grep -q 'ksu54_sidtab_dup' $S/selinux/sepolicy.h && echo YES || echo NO
          printf "  %-26s " "sidtab deep copy"; grep -q 'context_cpy' $S/selinux/sepolicy.h && echo YES || echo NO
          printf "  %-26s " "granting accessor"; grep -q 'ksu54_pol_get_granting' $S/selinux/sepolicy.h && echo YES || echo NO
          printf "  %-26s " "view guard"; grep -q 'KSU54_POL_IS_OWNED' $S/selinux/sepolicy.c && echo YES || echo NO
          printf "  %-26s " "double-free guard"; grep -q 'pol = NULL' $S/selinux/rules.c && echo YES || echo NO
          printf "  %-26s " "seqno saved"; test "$(grep -c '__ksu54_seqno = ksu54' $S/selinux/rules.c)" = "2" && echo YES || echo NO
          printf "  %-26s " "hide guards flipped"; test "$(grep -c 'ifdef CONFIG_KSU_SUSFS' $S/feature/selinux_hide.c)" = "0" && echo YES || echo NO
          printf "  %-26s " "hide 5.4 backend"; grep -q 'ksu54_selinux_hide_54' $S/feature/selinux_hide.c && echo YES || echo NO
          printf "  %-26s " "dynamic manager cfg"; grep -q 'KSU_DYNAMIC_MANAGER' .github/workflows/finasu.yml && echo YES || echo NO
          printf "  %-26s " "no bad lvalue"; test "$(grep -cE '^\s*ksu54_pol_get_granting\([a-z_]+\)\s*=' $S/selinux/rules.c)" = "0" && echo YES || echo NO
          printf "  %-26s " "no raw granting"; test "$(cat $S/selinux/rules.c $S/feature/selinux_hide.c $S/selinux/sepolicy.c | grep -c '->latest_granting')" = "0" && echo YES || echo NO
          printf "  %-26s " "policy shim order"; sed -n '/^struct selinux_policy {/,/};/p' $S/selinux/sepolicy.h | tr -d '\t' | tr '\n' ' '
          echo ""
          printf "  %-26s " "policy shadow"; grep -q 'KSU54_POLICY_FIELD' $S/selinux/rules.c && echo YES || echo NO
          printf "  %-26s " "filename_trans"; grep -q 'one hashtab record per' $S/selinux/sepolicy.c && echo YES || echo NO
          printf "  %-26s " "pkg_observer"; grep -q 'ksu54_pkg_observer' $S/manager/pkg_observer.c && echo YES || echo NO
          printf "  %-26s " "preinit disabled"; grep -q 'KSU_NO_PREINIT' $S/Kbuild && echo YES || echo NO
          printf "  %-26s " "compat coverage"; echo "$(grep -rl 'ksu54_compat.h' $S --include=*.c --include=*.h | wc -l) files"

      - name: Install clang (Ubuntu apt, matches working kernels)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex libssl-dev libelf-dev python3 curl cpio kmod rsync zip unzip device-tree-compiler wget clang lld llvm
          echo "=== clang ==="
          clang --version | head -2
          echo "=== lld ==="
          ld.lld --version | head -1
          echo "=== which ==="
          which clang ld.lld llvm-ar llvm-objcopy llvm-nm llvm-strip

      - name: Defconfig + SUSFS + headers
        run: |
          DEV="${{ github.event.inputs.device }}"
          [ -z "$DEV" ] && DEV=star
          SUSFS="${{ github.event.inputs.enable_susfs }}"
          export PATH="$HOME/tc/bin:$PATH"
          O="out_${DEV}"
          CFG="$O/.config"

          make -j"$(nproc)" ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 O="$O" "${DEV}_defconfig" 2>&1 | tail -5

          ./scripts/config --file "$CFG" \
            --enable KSU --enable KPROBES --enable KALLSYMS_ALL \
            --enable EXT4_FS --enable HEADERS_INSTALL --enable THREAD_INFO_IN_TASK

          if [ "$SUSFS" = "1" ]; then
            ./scripts/config --file "$CFG" \
              --enable KSU_DYNAMIC_MANAGER \
              --enable KSU_SUSFS --enable KSU_SUSFS_SUS_PATH \
              --enable KSU_SUSFS_SUS_MOUNT --enable KSU_SUSFS_SUS_KSTAT \
              --enable KSU_SUSFS_SPOOF_UNAME --enable KSU_SUSFS_ENABLE_LOG \
              --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              --enable KSU_SUSFS_OPEN_REDIRECT --enable KSU_SUSFS_SUS_MAP
          fi

          make -j"$(nproc)" ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 O="$O" olddefconfig 2>&1 | tail -2

          echo "=== config ==="
          grep -E "^CONFIG_KSU=|^CONFIG_THREAD_INFO_IN_TASK=|^CONFIG_KPROBES=" "$CFG" || echo MISS
          grep -E "^CONFIG_KSU_SUSFS" "$CFG" || echo "SUSFS OFF"

          # FinaSU 的 Kbuild 检查 $(objtree)/usr/include/linux/unistd.h 来决定是否编译
          # preinit。INSTALL_HDR_PATH 必须是 objtree 才对得上，否则 preinit 被静默跳过，
          # init 的 selinux_setup 阶段没有 KSU 介入 -> 卡第一屏。
          make -j"$(nproc)" ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 \
            O="$O" headers_install INSTALL_HDR_PATH="$(pwd)/$O/usr" 2>&1 | tail -3
          echo "objtree usr/include: $(find "$O/usr/include" -type f 2>/dev/null | wc -l) files"
          ls -l "$O/usr/include/linux/unistd.h" 2>&1 || echo "::error::unistd.h MISSING -> preinit will be disabled"

      - name: Build
        run: |
          DEV="${{ github.event.inputs.device }}"
          [ -z "$DEV" ] && DEV=star
          export PATH="$HOME/tc/bin:$PATH"
          O="out_${DEV}"
          set +e
          # KSU_REQUIRE_PREINIT 用环境变量导出，确保 Kbuild 的 ifeq 看得到
          export KSU_REQUIRE_PREINIT=1
          make -j"$(nproc)" ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 \
            O="$O" modules Image > /tmp/build.log 2>&1
          RC=$?
          echo "exit=$RC"
          echo "=== error count ==="
          grep -c "error:" /tmp/build.log || true
          echo "=== errors ==="
          grep "error:" /tmp/build.log | head -40
          echo ""
          echo "=== preinit check ==="
          grep -c "preinit" /tmp/build.log 2>/dev/null || true
          grep -E "preinit disabled|UAPI headers missing" /tmp/build.log 2>/dev/null || echo "preinit: no skip warning (good)"
          echo ""
          ls -lh "$O/arch/arm64/boot/Image" 2>/dev/null || echo NO_IMAGE
          cp /tmp/build.log build.log 2>/dev/null || true

      - name: Package
        if: always()
        run: |
          DEV="${{ github.event.inputs.device }}"
          [ -z "$DEV" ] && DEV=star
          IMG="out_${DEV}/arch/arm64/boot/Image"
          [ -f "$IMG" ] || { echo NO_IMAGE; exit 0; }
          echo "=== Image ==="
          ls -lh "$IMG"
          strings "$IMG" | grep -m1 "Linux version 5"
          echo "SUSFS strings: $(strings "$IMG" | grep -ic susfs)"
          echo "preinit strings : $(strings "$IMG" | grep -c 'preinit')"
          echo "selinux_setup   : $(strings "$IMG" | grep -c 'selinux_setup')  (must be >0)"
          echo ""
          wget -q -O ak3.zip "https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip"
          unzip -q ak3.zip
          AK=$(ls -d AnyKernel3-*)
          cp "$IMG" "$AK/Image"
          cd "$AK"
          # 用 star 专用的 anykernel.sh 覆盖模板（原模板是 Galaxy Nexus/omap，
          # BLOCK 指向 omap_hsmmc 会导致找不到 boot 分区而 Aborting）
          echo '' | base64 -d > anykernel.sh
          echo "=== anykernel.sh ==="
          grep -E "^BLOCK=|^IS_SLOT_DEVICE=|^device.name1=|^do.devicecheck=" anykernel.sh
          zip -r9 ../FinaSU_star_merged.zip . -x ".git/*" "README.md"
          cd ..
          ls -lh FinaSU_star_merged.zip

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finasu-merged
          path: |
            FinaSU_star_merged.zip
            build.log
          retention-days: 30
          if-no-files-found: warn
