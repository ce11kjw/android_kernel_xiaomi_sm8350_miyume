name: Build FinaSU

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'device codename'
        required: true
        default: 'star'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 200

    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup FinaSU
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf KernelSU
          git submodule deinit -f KernelSU 2>/dev/null || true
          rm -rf .git/modules/KernelSU 2>/dev/null || true
          git clone --depth 50 https://github.com/LyraVoid/FinaSU.git /tmp/FinaSU
          cd /tmp/FinaSU
          git log -1 --format='%H %s'
          cd "$GITHUB_WORKSPACE"
          bash /tmp/FinaSU/kernel/setup.sh --dir /tmp/FinaSU
          ls -l drivers/kernelsu | head -2

      - name: Apply patches
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "=== 下载补丁脚本 ==="
          curl -sL -o /tmp/patch54.py "https://raw.githubusercontent.com/ce11kjw/kbuild-helper/main/patch54.py"
          curl -sL -o /tmp/seccomp_cache_54.c "https://raw.githubusercontent.com/ce11kjw/kbuild-helper/main/seccomp_cache_54.c"
          curl -sL -o /tmp/pkg_observer_54.c "https://raw.githubusercontent.com/ce11kjw/kbuild-helper/main/pkg_observer_54.c"
          curl -sL -o /tmp/selinux54d.py "https://raw.githubusercontent.com/ce11kjw/kbuild-helper/main/selinux54d.py"
          curl -sL -o /tmp/fntrans54.py "https://raw.githubusercontent.com/ce11kjw/kbuild-helper/main/fntrans54.py"
          curl -sL -o /tmp/hide54.py "https://raw.githubusercontent.com/ce11kjw/kbuild-helper/main/hide54.py"
          curl -sL -o /tmp/sidtab54.py "https://raw.githubusercontent.com/ce11kjw/kbuild-helper/main/sidtab54.py"
          curl -sL -o /tmp/selinux_access54.h "https://raw.githubusercontent.com/ce11kjw/kbuild-helper/main/selinux_access54.h"
          echo "--- 文件确认 ---"
          ls -l /tmp/patch54.py /tmp/seccomp_cache_54.c
          head -3 /tmp/seccomp_cache_54.c
          echo ""
          echo "=== 执行补丁 ==="
          python3 /tmp/patch54.py
          echo ""
          echo "=== 验证 seccomp_cache.c ==="
          FIN_REAL=$(readlink -f drivers/kernelsu)
          echo "FinaSU real path: $FIN_REAL"
          head -8 "$FIN_REAL/infra/seccomp_cache.c"

      - name: Install clang 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex libssl-dev libelf-dev python3 curl cpio kmod rsync zip unzip device-tree-compiler wget
          mkdir -p "$HOME/tc"
          cd "$HOME/tc"
          wget -q --timeout=90 --tries=3 -O clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-build-2024/clang-r510928.tar.gz"
          tar xzf clang.tar.gz
          if [ -x bin/clang ]; then
            echo "$HOME/tc/bin" >> "$GITHUB_PATH"
            bin/clang --version | head -1
          fi

      - name: Defconfig + headers
        run: |
          DEV="${{ github.event.inputs.device }}"
          if [ -z "$DEV" ]; then DEV=star; fi
          export PATH="$HOME/tc/bin:$PATH"
          O="out_${DEV}"
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 O="$O" "${DEV}_defconfig" 2>&1 | tail -6
          ./scripts/config --file "$O/.config" --enable KPROBES
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 O="$O" olddefconfig 2>&1 | tail -2
          grep -E "^CONFIG_(KSU|KPROBES|KALLSYMS_ALL|EXT4_FS|HEADERS_INSTALL)=" "$O/.config"
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 O="$O" headers_install INSTALL_HDR_PATH="$(pwd)/usr" 2>&1 | tail -4
          echo "usr/include 文件数: $(find usr/include -type f 2>/dev/null | wc -l)"

      - name: Build
        run: |
          DEV="${{ github.event.inputs.device }}"
          if [ -z "$DEV" ]; then DEV=star; fi
          export PATH="$HOME/tc/bin:$PATH"
          O="out_${DEV}"
          set +e
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 O="$O" KSU_REQUIRE_PREINIT=1 modules Image > /tmp/build.log 2>&1
          RC=$?
          echo "exit=$RC"
          grep -E "error:|Error [0-9]|Stop\.|undeclared|undefined" /tmp/build.log | head -20
          echo ""
          tail -25 /tmp/build.log
          echo ""
          ls -lh "$O/arch/arm64/boot/Image" 2>/dev/null || echo NO_IMAGE

      - name: Package
        if: always()
        run: |
          DEV="${{ github.event.inputs.device }}"
          if [ -z "$DEV" ]; then DEV=star; fi
          IMG="out_${DEV}/arch/arm64/boot/Image"
          if [ ! -f "$IMG" ]; then echo "NO_IMAGE"; exit 0; fi
          ls -lh "$IMG"
          strings "$IMG" | grep -m1 "Linux version 5"
          echo "FinaSU: $(strings "$IMG" | grep -ic finasu)"
          wget -q -O ak3.zip "https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip"
          unzip -q ak3.zip
          AK=$(ls -d AnyKernel3-*)
          cp "$IMG" "$AK/Image"
          cd "$AK"
          sed -i 's/^kernel.string=.*/kernel.string=FinaSU-Star/' anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i 's/^block=.*/block=boot;/' anykernel.sh
          sed -i 's/^is_slot_device=.*/is_slot_device=1/' anykernel.sh
          zip -r9 ../FinaSU_star_AK3.zip . -x ".git/*" "README.md"
          cd ..
          ls -lh FinaSU_star_AK3.zip

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finasu-star
          path: FinaSU_star_AK3.zip
          retention-days: 30
          if-no-files-found: warn
