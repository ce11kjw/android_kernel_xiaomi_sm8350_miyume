name: Build HoshinoNeko Star (Clang18)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'device'
        required: true
        default: 'star'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 200

    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone latest KernelSU
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf KernelSU
          git clone --depth 1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          cd KernelSU && git log -1 --format='%H %s'

      - name: Install deps + clang 18
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex libssl-dev libelf-dev \
            python3 curl cpio kmod rsync zip unzip device-tree-compiler wget
          cd $HOME
          mkdir -p tc && cd tc
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-build-2024/clang-r510928.tar.gz"
          for attempt in 1 2 3; do
            echo "=== 尝试 $attempt ==="
            if wget -q --timeout=60 --tries=2 -O clang.tar.gz "$URL"; then
              if [ -s clang.tar.gz ]; then break; fi
            fi
            sleep 5
          done
          ls -lh clang.tar.gz
          tar xzf clang.tar.gz
          echo "=== 内容 ==="
          ls | head -10
          if [ -x bin/clang ]; then
            echo "$HOME/tc/bin" >> $GITHUB_PATH
            bin/clang --version | head -2
          else
            echo "!!! 没有 bin/clang，用系统 clang"
            sudo apt-get install -y clang lld
          fi

      - name: Verify
        run: |
          export PATH=$HOME/tc/bin:$PATH
          which clang
          clang --version | head -2

      - name: Build
        run: |
          DEV="${{ github.event.inputs.device }}"; [ -z "$DEV" ] && DEV=star
          export PATH=$HOME/tc/bin:$PATH
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out_${DEV} ${DEV}_defconfig 2>&1 | tail -10
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out_${DEV} modules Image 2>&1 | tail -50

      - name: Version
        run: |
          DEV="${{ github.event.inputs.device }}"; [ -z "$DEV" ] && DEV=star
          IMG="out_${DEV}/arch/arm64/boot/Image"
          ls -lh "$IMG"
          strings "$IMG" | grep -m1 "Linux version 5"
          strings "$IMG" | grep -oE "v4\.[0-9]+\.[0-9]+[a-z0-9@._-]*" | head -1
          strings "$IMG" | grep -oE "susfs is initialized! version: v[0-9.]+" | head -1

      - name: Package
        run: |
          DEV="${{ github.event.inputs.device }}"; [ -z "$DEV" ] && DEV=star
          IMG="out_${DEV}/arch/arm64/boot/Image"
          wget -q -O ak3.zip "https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip"
          unzip -q ak3.zip
          AK=$(ls -d AnyKernel3-*)
          cp "$IMG" "$AK/Image"
          cd "$AK"
          sed -i "s/^kernel.string=.*/kernel.string=HoshinoNeko Star/g" anykernel.sh || true
          sed -i "s/^do.devicecheck=.*/do.devicecheck=0/" anykernel.sh || true
          sed -i "s/^block=.*/block=boot;/" anykernel.sh || true
          sed -i "s/^is_slot_device=.*/is_slot_device=1/" anykernel.sh || true
          zip -r9 "../HN_${DEV}_AK3.zip" * -x .git README.md
          cd ..
          ls -lh HN_${DEV}_AK3.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.event.inputs.device }}
          path: HN_*_AK3.zip
          retention-days: 30
