name: Build FinaSU Kernel (star)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'device'
        required: true
        default: 'star'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true; df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 1, submodules: false }

      - name: Setup FinaSU
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf KernelSU
          git submodule deinit -f KernelSU 2>/dev/null || true
          rm -rf .git/modules/KernelSU 2>/dev/null || true
          git clone --depth 1 https://github.com/LyraVoid/FinaSU.git /tmp/FinaSU
          cd /tmp/FinaSU && git log -1 --format='%H'
          cd "$GITHUB_WORKSPACE"
          bash /tmp/FinaSU/kernel/setup.sh --dir /tmp/FinaSU 2>&1 | tail -8
          ls -l drivers/kernelsu | head -2

      - name: Install clang 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex libssl-dev libelf-dev python3 curl cpio kmod rsync zip unzip device-tree-compiler wget
          mkdir -p $HOME/tc && cd $HOME/tc
          wget -q --timeout=90 --tries=3 -O clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-build-2024/clang-r510928.tar.gz"
          tar xzf clang.tar.gz
          [ -x bin/clang ] && { echo "$HOME/tc/bin" >> $GITHUB_PATH; bin/clang --version | head -1; } || sudo apt-get install -y clang lld

      - name: Build (all in one)
        run: |
          DEV="${{ github.event.inputs.device }}"; [ -z "$DEV" ] && DEV=star
          export PATH=$HOME/tc/bin:$PATH
          export ARCH=arm64 LLVM=1 LLVM_IAS=1
          O=out_${DEV}

          echo "=== 1. defconfig ==="
          make -j$(nproc) O=$O ${DEV}_defconfig 2>&1 | tail -5

          echo "=== 2. 启用 FinaSU 配置 ==="
          CFG=$O/.config
          for k in CONFIG_KSU CONFIG_KPROBES CONFIG_KALLSYMS_ALL CONFIG_EXT4_FS CONFIG_HEADERS_INSTALL CONFIG_THREAD_INFO_IN_TASK; do
            if grep -q "^${k}=" "$CFG"; then sed -i "s|^${k}=.*|${k}=y|" "$CFG";
            elif grep -q "^# ${k} is not set" "$CFG"; then sed -i "s|^# ${k} is not set|${k}=y|" "$CFG";
            else echo "${k}=y" >> "$CFG"; fi
          done
          grep -E "^CONFIG_(KSU|KPROBES|KALLSYMS_ALL|EXT4_FS|HEADERS_INSTALL)=" "$CFG"

          echo "=== 3. headers_install (默认路径 usr/) ==="
          make -j$(nproc) O=$O headers_install 2>&1 | tail -10
          echo "--- 检查 usr/include ---"
          ls $O/usr/include/ 2>/dev/null | head -5
          ls ./usr/include 2>/dev/null | head -5

          echo "=== 4. 同步 config ==="
          make -j$(nproc) O=$O olddefconfig 2>&1 | tail -5
          grep -E "^CONFIG_KSU=" $O/.config

          echo "=== 5. 编译内核 ==="
          make -j$(nproc) O=$O \
            KSU_REQUIRE_PREINIT=1 \
            KSU_EXPECTED_SIZE=0x2cc \
            KSU_EXPECTED_HASH=2d89b50aaf1db013c2b6738f973f48b62ea21a3a8d7216bfec3521065d448458 \
            modules Image 2>&1 | tail -40

          echo "=== 6. 检查产物 ==="
          ls -lh $O/arch/arm64/boot/Image 2>/dev/null || echo "!!! Image 不存在"

      - name: Package
        run: |
          DEV="${{ github.event.inputs.device }}"; [ -z "$DEV" ] && DEV=star
          IMG="out_${DEV}/arch/arm64/boot/Image"
          if [ ! -f "$IMG" ]; then echo "无 Image，跳过"; exit 1; fi
          wget -q -O ak3.zip "https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip"
          unzip -q ak3.zip
          AK=$(ls -d AnyKernel3-*)
          cp "$IMG" "$AK/Image"
          cd "$AK"
          sed -i "s/^kernel.string=.*/kernel.string=FinaSU Star/g" anykernel.sh || true
          sed -i "s/^do.devicecheck=.*/do.devicecheck=0/" anykernel.sh || true
          sed -i "s/^block=.*/block=boot;/" anykernel.sh || true
          sed -i "s/^is_slot_device=.*/is_slot_device=1/" anykernel.sh || true
          zip -r9 "../FinaSU_star_AK3.zip" * -x .git README.md
          cd ..
          ls -lh FinaSU_star_AK3.zip
          echo "=== 版本 ==="
          strings "$IMG" | grep -m1 "Linux version 5"
          echo "FinaSU 特征: $(strings "$IMG" | grep -ic finasu)"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finasu-star
          path: FinaSU_star_AK3.zip
          retention-days: 30
          if-no-files-found: warn
