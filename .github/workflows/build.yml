name: Build HoshinoNeko Kernel (Star)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device codename'
        required: true
        default: 'star'
      ksu_ref:
        description: 'ReSukiSU ref (empty = main HEAD)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Update KernelSU to latest main
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "=== 删除旧 submodule，克隆最新 ==="
          rm -rf KernelSU
          KREF="${{ github.event.inputs.ksu_ref }}"
          if [ -z "$KREF" ]; then KREF="main"; fi
          echo "ref=$KREF"
          git clone --depth 50 https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          cd KernelSU
          if [ "$KREF" != "main" ]; then
            git fetch --depth 50 origin "$KREF" && git checkout FETCH_HEAD
          fi
          echo "=== 当前 commit ==="
          git log -1 --format='%H %s'
          echo "=== 检查结构 ==="
          ls
          if [ -d kernel ] && [ -f kernel/Makefile ]; then echo "结构OK: kernel/"; else echo "警告: kernel/ 不存在"; ls -la; fi

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex libssl-dev libelf-dev \
            python3 git curl cpio kmod rsync zip unzip device-tree-compiler
          echo "=== clang 18 ==="
          mkdir -p $HOME/tc && cd $HOME/tc
          curl -sL --retry 3 -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-2025/clang-r547379.tar.gz"
          if [ -s clang.tar.gz ]; then
            tar xzf clang.tar.gz
            echo "$HOME/tc/bin" >> $GITHUB_PATH
            echo "clang 已安装"
          else
            echo "下载失败，用系统 clang"
            sudo apt-get install -y clang lld llvm
          fi

      - name: Verify compiler
        run: |
          which clang; clang --version | head -2

      - name: Build kernel
        run: |
          DEV="${{ github.event.inputs.device }}"
          [ -z "$DEV" ] && DEV=star
          export PATH=$HOME/tc/bin:$PATH
          echo "=== defconfig $DEV ==="
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out_${DEV} ${DEV}_defconfig 2>&1 | tail -20
          echo "=== 编译 ==="
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out_${DEV} modules Image 2>&1 | tail -100

      - name: Show kernel version
        run: |
          DEV="${{ github.event.inputs.device }}"
          [ -z "$DEV" ] && DEV=star
          IMG="out_${DEV}/arch/arm64/boot/Image"
          ls -lh "$IMG"
          strings "$IMG" | grep -m2 "Linux version 5"
          echo "=== KSU 版本 ==="
          strings "$IMG" | grep -oE "v4\.[0-9]+\.[0-9]+[a-z0-9@._-]*" | head -5
          echo "=== SUSFS 版本 ==="
          strings "$IMG" | grep -oE "susfs is initialized! version: v[0-9.]+" | head -2

      - name: Package AnyKernel3
        run: |
          DEV="${{ github.event.inputs.device }}"
          [ -z "$DEV" ] && DEV=star
          IMG="out_${DEV}/arch/arm64/boot/Image"
          curl -sL -o ak3.zip "https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip"
          unzip -q ak3.zip
          AK=$(ls -d AnyKernel3-*)
          cp "$IMG" "$AK/Image"
          cd "$AK"
          sed -i "s/^kernel.string=.*/kernel.string=HoshinoNeko Star BakaSU/g" anykernel.sh || true
          sed -i "s/^do.devicecheck=.*/do.devicecheck=0/" anykernel.sh || true
          sed -i "s/^block=.*/block=boot;/" anykernel.sh || true
          sed -i "s/^is_slot_device=.*/is_slot_device=1/" anykernel.sh || true
          zip -r9 "../HoshinoNeko_${DEV}_BakaSU_AnyKernel3.zip" * -x .git README.md
          cd ..
          ls -lh HoshinoNeko_${DEV}_BakaSU_AnyKernel3.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.event.inputs.device }}-${{ github.run_number }}
          path: HoshinoNeko_*_AnyKernel3.zip
          retention-days: 30
