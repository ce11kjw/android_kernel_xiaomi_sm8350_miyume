name: Build MiaoMiao Kernel + FinaSU (star)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'device (star/venus/mars/haydn)'
        required: true
        default: 'star'
      finasu_ref:
        description: 'FinaSU ref (empty = latest)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout MiaoMiao kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Remove existing KernelSU + setup FinaSU
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "=== 移除现有 KernelSU (ReSukiSU) ==="
          rm -rf KernelSU
          # 清理 git submodule 记录
          git submodule deinit -f KernelSU 2>/dev/null || true
          git rm -r --cached KernelSU 2>/dev/null || true
          rm -rf .git/modules/KernelSU 2>/dev/null || true

          echo "=== 克隆 FinaSU ==="
          REF="${{ github.event.inputs.finasu_ref }}"
          [ -z "$REF" ] && REF="master"
          git clone --depth 1 -b "$REF" https://github.com/LyraVoid/FinaSU.git /tmp/FinaSU || \
            git clone --depth 1 https://github.com/LyraVoid/FinaSU.git /tmp/FinaSU
          cd /tmp/FinaSU && git log -1 --format='%H %s'
          echo "=== FinaSU 结构 ==="
          ls

          echo "=== 执行 FinaSU setup.sh ==="
          cd "$GITHUB_WORKSPACE"
          ls kernel/ 2>/dev/null | head -5
          if [ -f /tmp/FinaSU/kernel/setup.sh ]; then
            bash /tmp/FinaSU/kernel/setup.sh --dir /tmp/FinaSU 2>&1 | tail -20
          else
            echo "!!! setup.sh 不存在，手动链接"
            ln -sfn /tmp/FinaSU/kernel drivers/kernelsu
            grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
            grep -q "kernelsu/Kconfig" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          echo "=== 验证 ==="
          ls -l drivers/kernelsu 2>/dev/null | head -3
          grep -n "kernelsu" drivers/Makefile | head -3

      - name: Install clang 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex libssl-dev libelf-dev \
            python3 curl cpio kmod rsync zip unzip device-tree-compiler wget
          mkdir -p $HOME/tc && cd $HOME/tc
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-build-2024/clang-r510928.tar.gz"
          wget -q --timeout=90 --tries=3 -O clang.tar.gz "$URL"
          tar xzf clang.tar.gz
          if [ -x bin/clang ]; then
            echo "$HOME/tc/bin" >> $GITHUB_PATH
            bin/clang --version | head -1
          else
            echo "用系统 clang"; sudo apt-get install -y clang lld
          fi

      - name: Configure kernel
        run: |
          DEV="${{ github.event.inputs.device }}"; [ -z "$DEV" ] && DEV=star
          export PATH=$HOME/tc/bin:$PATH
          echo "=== defconfig ==="
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out_${DEV} ${DEV}_defconfig 2>&1 | tail -10
          echo "=== 启用 FinaSU 所需配置 ==="
          CFG=out_${DEV}/.config
          enable() {
            K=$1
            if grep -q "^${K}=" "$CFG"; then
              sed -i "s|^${K}=.*|${K}=y|" "$CFG"
            elif grep -q "^# ${K} is not set" "$CFG"; then
              sed -i "s|^# ${K} is not set|${K}=y|" "$CFG"
            else
              echo "${K}=y" >> "$CFG"
            fi
          }
          for k in CONFIG_KSU CONFIG_KPROBES CONFIG_KALLSYMS_ALL CONFIG_EXT4_FS CONFIG_HEADERS_INSTALL CONFIG_THREAD_INFO_IN_TASK; do
            enable $k
          done
          echo "=== 验证 ==="
          grep -E "^CONFIG_(KSU|KPROBES|KALLSYMS_ALL|EXT4_FS|HEADERS_INSTALL)=" "$CFG"

      - name: Build
        run: |
          DEV="${{ github.event.inputs.device }}"; [ -z "$DEV" ] && DEV=star
          export PATH=$HOME/tc/bin:$PATH
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out_${DEV} \
            KSU_REQUIRE_PREINIT=1 \
            KSU_EXPECTED_SIZE=0x2cc \
            KSU_EXPECTED_HASH=2d89b50aaf1db013c2b6738f973f48b62ea21a3a8d7216bfec3521065d448458 \
            modules Image 2>&1 | tail -80

      - name: Show version
        run: |
          DEV="${{ github.event.inputs.device }}"; [ -z "$DEV" ] && DEV=star
          IMG="out_${DEV}/arch/arm64/boot/Image"
          ls -lh "$IMG"
          strings "$IMG" | grep -m1 "Linux version 5"
          echo "=== FinaSU 特征 ==="
          strings "$IMG" | grep -icE "finasu"
          strings "$IMG" | grep -m3 -iE "FinaSU|crowning manager"

      - name: Package AK3
        run: |
          DEV="${{ github.event.inputs.device }}"; [ -z "$DEV" ] && DEV=star
          IMG="out_${DEV}/arch/arm64/boot/Image"
          wget -q -O ak3.zip "https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip"
          unzip -q ak3.zip
          AK=$(ls -d AnyKernel3-*)
          cp "$IMG" "$AK/Image"
          cd "$AK"
          sed -i "s/^kernel.string=.*/kernel.string=MiaoMiao+FinaSU Star/g" anykernel.sh || true
          sed -i "s/^do.devicecheck=.*/do.devicecheck=0/" anykernel.sh || true
          sed -i "s/^block=.*/block=boot;/" anykernel.sh || true
          sed -i "s/^is_slot_device=.*/is_slot_device=1/" anykernel.sh || true
          zip -r9 "../FinaSU_${DEV}_AK3.zip" * -x .git README.md
          cd ..
          ls -lh FinaSU_${DEV}_AK3.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: finasu-${{ github.event.inputs.device }}
          path: FinaSU_*_AK3.zip
          retention-days: 30
