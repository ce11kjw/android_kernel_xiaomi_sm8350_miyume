name: Build MiaoMiao Kernel + FinaSU (star)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'device'
        required: true
        default: 'star'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup FinaSU
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf KernelSU
          git submodule deinit -f KernelSU 2>/dev/null || true
          rm -rf .git/modules/KernelSU 2>/dev/null || true
          rm -f drivers/kernelsu 2>/dev/null || true

          git clone --depth 1 https://github.com/LyraVoid/FinaSU.git /tmp/FinaSU
          cd /tmp/FinaSU && git log -1 --format='%H %s'

          cd "$GITHUB_WORKSPACE"
          bash /tmp/FinaSU/kernel/setup.sh --dir /tmp/FinaSU 2>&1 | tail -15
          ls -l drivers/kernelsu | head -2
          grep -n "kernelsu" drivers/Makefile | head -2
          grep -n "kernelsu" drivers/Kconfig | head -2

      - name: Install clang 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex libssl-dev libelf-dev \
            python3 curl cpio kmod rsync zip unzip device-tree-compiler wget
          mkdir -p $HOME/tc && cd $HOME/tc
          wget -q --timeout=90 --tries=3 -O clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-build-2024/clang-r510928.tar.gz"
          tar xzf clang.tar.gz
          if [ -x bin/clang ]; then
            echo "$HOME/tc/bin" >> $GITHUB_PATH
            bin/clang --version | head -1
          else
            sudo apt-get install -y clang lld
          fi

      - name: Defconfig + enable KSU
        run: |
          DEV="${{ github.event.inputs.device }}"; [ -z "$DEV" ] && DEV=star
          export PATH=$HOME/tc/bin:$PATH
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out_${DEV} ${DEV}_defconfig 2>&1 | tail -8

          CFG=out_${DEV}/.config
          echo "=== 修改 .config ==="
          enable() {
            K=$1
            if grep -q "^${K}=" "$CFG"; then
              sed -i "s|^${K}=.*|${K}=y|" "$CFG"
            elif grep -q "^# ${K} is not set" "$CFG"; then
              sed -i "s|^# ${K} is not set|${K}=y|" "$CFG"
            elif ! grep -q "^${K}=" "$CFG"; then
              echo "${K}=y" >> "$CFG"
            fi
          }
          for k in CONFIG_KSU CONFIG_KPROBES CONFIG_KALLSYMS_ALL CONFIG_EXT4_FS CONFIG_HEADERS_INSTALL CONFIG_THREAD_INFO_IN_TASK; do
            enable $k
          done
          grep -E "^CONFIG_(KSU|KPROBES|KALLSYMS_ALL|EXT4_FS|HEADERS_INSTALL|THREAD_INFO)" "$CFG"

      - name: Generate UAPI headers
        run: |
          DEV="${{ github.event.inputs.device }}"; [ -z "$DEV" ] && DEV=star
          export PATH=$HOME/tc/bin:$PATH
          echo "=== headers_install -> usr/include ==="
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out_${DEV} headers_install INSTALL_HDR_PATH=out_${DEV}/usr 2>&1 | tail -20
          echo "=== 验证 ==="
          ls out_${DEV}/usr/include/ 2>/dev/null | head -10
          ls -ld out_${DEV}/usr 2>/dev/null

      - name: Prepare kernel
        run: |
          DEV="${{ github.event.inputs.device }}"; [ -z "$DEV" ] && DEV=star
          export PATH=$HOME/tc/bin:$PATH
          echo "=== 预编译（生成 scripts 等）==="
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out_${DEV} prepare 2>&1 | tail -15

      - name: Build with FinaSU
        run: |
          DEV="${{ github.event.inputs.device }}"; [ -z "$DEV" ] && DEV=star
          export PATH=$HOME/tc/bin:$PATH
          echo "=== 确认 usr/include 存在 ==="
          ls out_${DEV}/usr/include 2>/dev/null | head -5 || echo "!!! 不存在"
          echo "=== 开始编译 ==="
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out_${DEV} \
            KSU_REQUIRE_PREINIT=1 \
            KSU_EXPECTED_SIZE=0x2cc \
            KSU_EXPECTED_HASH=2d89b50aaf1db013c2b6738f973f48b62ea21a3a8d7216bfec3521065d448458 \
            modules Image 2>&1 | tail -60

      - name: Verify
        run: |
          DEV="${{ github.event.inputs.device }}"; [ -z "$DEV" ] && DEV=star
          IMG="out_${DEV}/arch/arm64/boot/Image"
          ls -lh "$IMG"
          strings "$IMG" | grep -m1 "Linux version 5"
          echo "FinaSU 特征数: $(strings "$IMG" | grep -ic finasu)"
          strings "$IMG" | grep -m2 -i "crowning manager"

      - name: Package
        run: |
          DEV="${{ github.event.inputs.device }}"; [ -z "$DEV" ] && DEV=star
          IMG="out_${DEV}/arch/arm64/boot/Image"
          wget -q -O ak3.zip "https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip"
          unzip -q ak3.zip
          AK=$(ls -d AnyKernel3-*)
          cp "$IMG" "$AK/Image"
          cd "$AK"
          sed -i "s/^kernel.string=.*/kernel.string=MiaoMiao+FinaSU/g" anykernel.sh || true
          sed -i "s/^do.devicecheck=.*/do.devicecheck=0/" anykernel.sh || true
          sed -i "s/^block=.*/block=boot;/" anykernel.sh || true
          sed -i "s/^is_slot_device=.*/is_slot_device=1/" anykernel.sh || true
          zip -r9 "../FinaSU_${DEV}_AK3.zip" * -x .git README.md
          cd ..
          ls -lh FinaSU_${DEV}_AK3.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: finasu-${{ github.event.inputs.device }}
          path: FinaSU_*_AK3.zip
          retention-days: 30
