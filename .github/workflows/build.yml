name: Build FinaSU (verbose error)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true

      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 1, submodules: false }

      - name: Setup FinaSU
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf KernelSU
          git submodule deinit -f KernelSU 2>/dev/null || true
          rm -rf .git/modules/KernelSU 2>/dev/null || true
          git clone --depth 1 https://github.com/LyraVoid/FinaSU.git /tmp/FinaSU
          bash /tmp/FinaSU/kernel/setup.sh --dir /tmp/FinaSU 2>&1 | tail -5

      - name: Install clang 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex libssl-dev libelf-dev python3 curl cpio kmod rsync zip unzip device-tree-compiler wget
          mkdir -p $HOME/tc && cd $HOME/tc
          wget -q --timeout=90 --tries=3 -O clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-build-2024/clang-r510928.tar.gz"
          tar xzf clang.tar.gz
          [ -x bin/clang ] && echo "$HOME/tc/bin" >> $GITHUB_PATH

      - name: Defconfig
        run: |
          export PATH=$HOME/tc/bin:$PATH
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out_star star_defconfig 2>&1 | tail -3
          CFG=out_star/.config
          for k in CONFIG_KSU CONFIG_KPROBES CONFIG_KALLSYMS_ALL CONFIG_EXT4_FS CONFIG_HEADERS_INSTALL CONFIG_THREAD_INFO_IN_TASK; do
            if grep -q "^${k}=" "$CFG"; then sed -i "s|^${k}=.*|${k}=y|" "$CFG";
            elif grep -q "^# ${k} is not set" "$CFG"; then sed -i "s|^# ${k} is not set|${k}=y|" "$CFG";
            else echo "${k}=y" >> "$CFG"; fi
          done
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out_star headers_install 2>&1 | tail -3
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out_star olddefconfig 2>&1 | tail -3

      - name: Build single-thread to catch error
        run: |
          export PATH=$HOME/tc/bin:$PATH
          set +e
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out_star \
            KSU_REQUIRE_PREINIT=1 \
            KSU_EXPECTED_SIZE=0x2cc \
            KSU_EXPECTED_HASH=2d89b50aaf1db013c2b6738f973f48b62ea21a3a8d7216bfec3521065d448458 \
            modules Image > /tmp/build.log 2>&1
          RC=$?
          echo "=== exit code: $RC ==="
          echo "=== 错误行 ==="
          grep -nE "error:|Error [0-9]|Stop\.|No rule|undefined|fatal" /tmp/build.log | head -40
          echo ""
          echo "=== 最后 60 行 ==="
          tail -60 /tmp/build.log
